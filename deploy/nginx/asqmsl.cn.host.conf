# 这个文件用于配置宿主机 Nginx，将 asqmsl.cn 和 www.asqmsl.cn 代理到本机 Docker 应用端口。

server {
    listen 80;
    server_name asqmsl.cn www.asqmsl.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name asqmsl.cn www.asqmsl.cn;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/asqmsl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asqmsl.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
